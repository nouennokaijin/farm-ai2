<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ナザリック大図書館</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d7a45b;
    font-family:"Yu Gothic",sans-serif;
    height:100vh;
    overflow:hidden;
}

/* ====================
   ヘッダー
==================== */

.header{
    position:relative;
    height:220px;
    overflow:hidden;
    border-bottom:none /* 1px solid #d7a45b; */
    transition:height .4s ease;
}

.header-image{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.65;
    transition:opacity .4s ease;
}

.header-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.7));
}

.header-overlay h1{
    color:#ffd700;
    font-size:42px;
    letter-spacing:4px;
    transition:.4s;
    text-shadow:0 0 15px rgba(255,215,0,.4);
}

.header-overlay p{
    margin-top:10px;
    transition:.4s;
}

/* 縮小 */

.header.shrink{
    height:70px;
}

.header.shrink .header-image{
    opacity:.15;
}

.header.shrink .header-overlay h1{
    font-size:24px;
}

.header.shrink .header-overlay p{
    opacity:0;
}

/* ====================
   レイアウト
==================== */

.container{
    display:flex;
    height:calc(100vh - 220px);
    transition:.4s;
}

.header.shrink + .container{
    height:calc(100vh - 70px);
}

/* ====================
   サイドバー
==================== */

.sidebar{
    width:220px;
    height:100vh;
    background:#111;
    border-right:none /* 1px solid #d7a45b; */
    overflow-y:auto;
    padding:15px;
}

/* 🔥 ボタン強化版 */
.menu-item{
    position:relative;
    padding:12px 14px;
    margin-bottom:12px;
    cursor:pointer;
    user-select:none;

    color:#b89a55;
    background:linear-gradient(145deg,#1a1a1a,#0f0f0f);
    border:1px solid #6d5522;
    border-radius:8px;

    transition:.25s;
    overflow:hidden;

    box-shadow:
        inset 0 0 0 rgba(0,0,0,0),
        0 0 0 rgba(0,0,0,0);
}

/* 左の魔導ライン */
.menu-item::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:3px;
    height:100%;
    background:linear-gradient(#ffd700, transparent, #8b6a2b);
    opacity:.6;
}

/* 上下の封印ライン */
.menu-item::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(to right, transparent, rgba(255,215,0,.12), transparent);
    opacity:0;
    transition:.25s;
}

/* hover */
.menu-item:hover{
    transform:translateY(-2px);
    background:linear-gradient(145deg,#222,#111);
    border-color:#a8842f;
    box-shadow:
        0 6px 18px rgba(0,0,0,.6),
        0 0 12px rgba(255,215,0,.08);
}

.menu-item:hover::after{
    opacity:1;
}

/* active（覚醒状態） */
.menu-item.active{
    color:#ffd700;
    border-color:#ffd700;
    background:linear-gradient(145deg,#2a220f,#141000);

    box-shadow:
        0 0 14px rgba(255,215,0,.18),
        inset 0 0 10px rgba(255,215,0,.08);
}

/* 押したとき */
.menu-item:active{
    transform:translateY(1px) scale(0.98);
}

/* ====================
   メイン
==================== */

.main{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.card{
    padding:20px;
    background:#1a1a1a;
    border:1px solid #d7a45b;
    min-height:200px;
}

/* ふわ切替 */
.fade{
    animation:fade .25s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<header class="header">
    <img src="./images/header.png" class="header-image">
    <div class="header-overlay">
        <h1>ナザリック大図書館</h1>
        <p>知識を蓄え、未来を紡ぐ魔導書庫</p>
    </div>
</header>

<div class="container">

    <div class="sidebar">

        <div class="menu-item active" data-page="home">🏠 ホーム</div>
        <div class="menu-item" data-page="library">📚 知識庫</div>
        <div class="menu-item" data-page="search">🔍 検索</div>
        <div class="menu-item" data-page="ai">🤖 AI</div>
        <div class="menu-item" data-page="settings">⚙ 設定</div>

    </div>

    <div class="main" id="main"></div>

</div>

<script>

const header = document.querySelector(".header");
const main = document.getElementById("main");
const items = document.querySelectorAll(".menu-item");

const pages = {
    home: `
        <div class="card">🏠 ホーム</div>
            世界のルールを調整する場所<br><br>
            物理法則・UI構造・アクセス権限を変更できます。<br>
            注意：一部変更は不可逆です。<br><br>
            ・テーマ：ダーク<br>
            ・ログ：有効<br>
            ・安全モード：ON
             ⚙ 設定<br>
            世界のルールを調整する場所<br><br>
            物理法則・UI構造・アクセス権限を変更できます。<br>
            注意：一部変更は不可逆です。<br><br>
            ・テーマ：ダーク<br>
            ・ログ：有効<br>
            ・安全モード：ON ⚙ 設定<br>
            世界のルールを調整する場所<br><br>
            物理法則・UI構造・アクセス権限を変更できます。<br>
            注意：一部変更は不可逆です。<br><br>
            ・テーマ：ダーク<br>
            ・ログ：有効<br>
            ・安全モード：ON
             ⚙ 設定<br>
            世界のルールを調整する場所<br><br>
            物理法則・UI構造・アクセス権限を変更できます。<br>
            注意：一部変更は不可逆です。<br><br>
            ・テーマ：ダーク<br>
            ・ログ：有効<br>
            ・安全モード：ON
            a
            a
            add
            add
            add
            add
            add
            
    `,
    library: `
        <div class="card">📚 知識庫</div>
    `,
    search: `
        <div class="card">🔍 検索</div>
    `,
    ai: `
        <div class="card">🤖 AI</div>
    `,
    settings: `
        <div class="card">⚙ 設定</div>
    `
};

function loadPage(page){
    main.innerHTML = pages[page] || "";
    main.classList.remove("fade");
    void main.offsetWidth;
    main.classList.add("fade");
}

loadPage("home");

items.forEach(item=>{
    item.addEventListener("click",()=>{

        items.forEach(i=>i.classList.remove("active"));
        item.classList.add("active");

        loadPage(item.dataset.page);
    });
});

/* ヘッダー縮小 */
main.addEventListener("scroll",()=>{

    if(main.scrollTop > 50){
        header.classList.add("shrink");
    }else{
        header.classList.remove("shrink");
    }

});

</script>

</body>
</html>
