<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Nazarick Library OS</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  display: flex;
  height: 100vh;
  background: #0f0f14;
  color: #e6e6e6;
}

/* 左メニュー */
#left {
  width: 200px;
  background: #151522;
  padding: 10px;
  box-sizing: border-box;
}

.menu-btn {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  background: #222236;
  border: none;
  color: white;
  cursor: pointer;
  border-radius: 6px;
}

/* 中央 */
#center {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

/* 右 */
#right {
  width: 260px;
  background: #1a1a28;
  padding: 10px;
  box-sizing: border-box;
  border-left: 1px solid #333;
}

/* カード */
.card {
  background: #222236;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  cursor: pointer;
}

input, textarea {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 6px;
}

button.save {
  width: 100%;
  padding: 10px;
  background: #4b4bff;
  border: none;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.tag {
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

<body>

<!-- 左 -->
<div id="left">
  <button class="menu-btn" onclick="setMode('search')">🔍 Search</button>
  <button class="menu-btn" onclick="setMode('record')">📚 Record</button>
</div>

<!-- 中央 -->
<div id="center">
  ナザリック図書館OS 起動待機中...
</div>

<!-- 右 -->
<div id="right">
  <h3>Detail</h3>
  <div id="detail">未選択</div>
</div>

<script>

// ============================
// 🧠 ナザリックDB（簡易ローカル）
// ============================
let DB = JSON.parse(localStorage.getItem("nazarick_db") || "[]");

let mode = "none";

// ============================
// モード切替
// ============================
function setMode(m){
  mode = m;

  if(m === "search") renderSearch();
  if(m === "record") renderRecord();
}

// ============================
// 検索AI（ダミー推論）
// ============================
function aiSearch(query){
  if(!query) return [];

  return DB.filter(d =>
    d.title.includes(query) ||
    d.content.includes(query) ||
    d.tags.some(t => query.includes(t))
  );
}

// ============================
// タグAI（超簡易疑似AI）
// ============================
function aiTag(text){
  let tags = [];

  if(text.includes("魔法")) tags.push("magic");
  if(text.includes("炎")) tags.push("fire");
  if(text.includes("本")) tags.push("library");
  if(text.includes("研究")) tags.push("research");

  if(tags.length === 0) tags.push("misc");

  return tags;
}

// ============================
// レコード追加AI補助
// ============================
function saveRecord(){
  let title = document.getElementById("title").value;
  let content = document.getElementById("content").value;

  let tags = aiTag(content);

  let data = {
    id: Date.now(),
    title,
    content,
    tags,
    created: new Date().toISOString()
  };

  DB.push(data);
  localStorage.setItem("nazarick_db", JSON.stringify(DB));

  alert("ナザリックに記録された");

  renderRecord();
}

// ============================
// 検索画面
// ============================
function renderSearch(){
  document.getElementById("center").innerHTML = `
    <h2>🔍 Search Mode</h2>
    <input id="searchBox" placeholder="曖昧検索OK（例：炎の魔法）">
    <button onclick="doSearch()">検索</button>
    <div id="results"></div>
  `;
}

function doSearch(){
  let q = document.getElementById("searchBox").value;
  let res = aiSearch(q);

  let html = res.map(r => `
    <div class="card" onclick="showDetail(${r.id})">
      <b>${r.title}</b><br>
      <div class="tag">${r.tags.join(", ")}</div>
    </div>
  `).join("");

  document.getElementById("results").innerHTML =
    html || "該当なし";
}

// ============================
// 記録画面
// ============================
function renderRecord(){
  document.getElementById("center").innerHTML = `
    <h2>📚 Record Mode</h2>

    <input id="title" placeholder="タイトル">
    <textarea id="content" rows="8" placeholder="ここに記録..."></textarea>

    <button class="save" onclick="saveRecord()">
      🧠 記憶に刻む
    </button>
  `;
}

// ============================
// 詳細表示
// ============================
function showDetail(id){
  let item = DB.find(d => d.id === id);

  document.getElementById("detail").innerHTML = `
    <b>${item.title}</b><br><br>
    ${item.content}<br><br>
    <div class="tag">tags: ${item.tags.join(", ")}</div>
  `;
}

</script>

</body>
</html>
