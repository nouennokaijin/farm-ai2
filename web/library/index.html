<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ナザリック知識庫</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:sans-serif;
}

/* 全体 */
.wrapper{
    display:flex;
    flex-direction:column;
    height:100vh;
}

/* 上メニュー */
.header{
    height:60px;
    flex-shrink:0;

    background:#2a2a2a;
    color:white;

    display:flex;
    align-items:center;
    padding:0 20px;
}

/* 下エリア */
.content{
    flex:1;
    display:flex;
    overflow:hidden;
}

/* 左メニュー */
.sidebar{
    width:250px;
    flex-shrink:0;

    background:#3a3a3a;
    color:white;

    padding:20px;
}

/* 中央 */
.main{
    flex:1;

    background:#f5f5f5;

    overflow-y:auto;
    padding:20px;
}

/* 動作確認用 */
.card{
    background:white;
    margin-bottom:15px;
    padding:20px;
    border-radius:8px;
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- 上 -->
    <div class="header">
        ナザリック知識庫
    </div>

    <!-- 左＋中央 -->
    <div class="content">

        <div class="sidebar">
            <p>📚 検索</p>
            <br>
            <p>📝 記録</p>
            <br>
            <p>🔖 URL</p>
            <br>
            <p>⚙ 設定</p>
        </div>

        <div class="main">

            <h2>中央だけスクロール確認</h2>

            <br>

            <div class="card">データ1</div>
            <div class="card">データ2</div>
            <div class="card">データ3</div>
            <div class="card">データ4</div>
            <div class="card">データ5</div>
            <div class="card">データ6</div>
            <div class="card">データ7</div>
            <div class="card">データ8</div>
            <div class="card">データ9</div>
            <div class="card">データ10</div>
            <div class="card">データ11</div>
            <div class="card">データ12</div>
            <div class="card">データ13</div>
            <div class="card">データ14</div>
            <div class="card">データ15</div>
            <div class="card">データ16</div>
            <div class="card">データ17</div>
            <div class="card">データ18</div>
            <div class="card">データ19</div>
            <div class="card">データ20</div>

        </div>

    </div>

</div>

</body>
</html>
