<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナザリック知識庫</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: #e6e6e6;
    height: 100vh;
    overflow: hidden; /* ← 全体スクロール禁止 */
}

/* ===== TOP BAR ===== */
.topbar {
    height: 50px;
    background: #111827;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2c2f3a;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
}

.logo {
    font-weight: bold;
    color: #9ca3ff;
    letter-spacing: 1px;
}

.top-actions button {
    margin-left: 8px;
    background: #1f2937;
    border: 1px solid #374151;
    color: white;
    padding: 5px 10px;
    cursor: pointer;
}

/* ===== LEFT SIDEBAR ===== */
.sidebar {
    width: 220px;
    background: #0f172a;
    border-right: 1px solid #2c2f3a;

    position: fixed;
    top: 50px;
    left: 0;
    bottom: 0;

    padding: 10px;
    overflow-y: auto;
}

.sidebar h3 {
    font-size: 14px;
    color: #9ca3ff;
    margin-bottom: 10px;
}

.menu-item {
    padding: 8px;
    cursor: pointer;
    border-radius: 5px;
}

.menu-item:hover {
    background: #1f2937;
}

/* ===== CONTENT AREA ===== */
.content {
    position: fixed;
    top: 50px;
    left: 220px;
    right: 0;
    bottom: 0;

    padding: 20px;
    overflow-y: auto; /* ← ここだけスクロール */
}
