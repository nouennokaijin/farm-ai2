<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ナザリック知識庫</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: #e6e6e6;
}

/* ===== TOP BAR ===== */
.topbar {
    background: #111827;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2c2f3a;
}

.logo {
    font-weight: bold;
    color: #9ca3ff;
    letter-spacing: 1px;
}

.top-actions button {
    margin-left: 8px;
    background: #1f2937;
    border: 1px solid #374151;
    color: white;
    padding: 5px 10px;
    cursor: pointer;
}

/* ===== LAYOUT ===== */
.container {
    display: flex;
}

/* LEFT MENU */
.sidebar {
    width: 220px;
    background: #0f172a;
    border-right: 1px solid #2c2f3a;
    height: calc(100vh - 50px);
    padding: 10px;
}

.sidebar h3 {
    font-size: 14px;
    color: #9ca3ff;
    margin-bottom: 10px;
}

.menu-item {
    padding: 8px;
    cursor: pointer;
    border-radius: 5px;
}

.menu-item:hover {
    background: #1f2937;
}

/* CENTER CONTENT */
.content {
    flex: 1;
    padding: 20px;
}

/* TAB BAR */
.tabs {
    display: flex;
    border-bottom: 1px solid #2c2f3a;
    margin-bottom: 15px;
}

.tab {
    padding: 8px 12px;
    cursor: pointer;
    background: #111827;
    margin-right: 5px;
    border-radius: 5px 5px 0 0;
}

.tab.active {
    background: #1f2937;
    color: #a5b4fc;
}

/* INFO BOX */
.infobox {
    float: right;
    width: 250px;
    background: #111827;
    border: 1px solid #2c2f3a;
    padding: 10px;
    margin-left: 15px;
}

.infobox h4 {
    margin-top: 0;
    color: #a5b4fc;
}

.info-row {
    font-size: 13px;
    margin-bottom: 6px;
    border-bottom: 1px dotted #2c2f3a;
    padding-bottom: 4px;
}

/* SECTION */
.section {
    margin-bottom: 20px;
}

.section h2 {
    border-left: 4px solid #6366f1;
    padding-left: 10px;
}

/* EDIT BAR */
.editbar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

.editbar button {
    background: #1f2937;
    border: 1px solid #374151;
    color: white;
    padding: 5px 8px;
    cursor: pointer;
}

/* FOOTER */
.footer {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: #6b7280;
    border-top: 1px solid #2c2f3a;
}

</style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">🗂 ナザリック知識庫</div>
    <div class="top-actions">
        <button>Sign in</button>
        <button>Watch</button>
        <button>History</button>
        <button>More</button>
    </div>
</div>

<div class="container">

    <!-- LEFT MENU -->
    <div class="sidebar">
        <h3>Navigation</h3>
        <div class="menu-item">Main</div>
        <div class="menu-item">Characters</div>
        <div class="menu-item">Items</div>
        <div class="menu-item">World</div>
        <div class="menu-item">Library</div>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <!-- TAB -->
        <div class="tabs">
            <div class="tab active">Article</div>
            <div class="tab">Talk</div>
            <div class="tab">Edit</div>
            <div class="tab">History</div>
        </div>

        <!-- EDIT BAR -->
        <div class="editbar">
            <button>Edit source</button>
            <button>Purge</button>
            <button>Add section</button>
        </div>

        <!-- INFBOX -->
        <div class="infobox">
            <h4>Personal Data</h4>
            <div class="info-row">Race: Unknown</div>
            <div class="info-row">Affiliation: Nazarick</div>
            <div class="info-row">Role: Librarian</div>
            <div class="info-row">Floor: 10th</div>
        </div>

        <!-- MAIN CONTENT PLACEHOLDER -->
        <div class="section">
            <h2>Overview</h2>
            <p>ここに知識データが表示される（記事は別管理）</p>
        </div>

        <div class="section">
            <h2>Appearance</h2>
            <p>画像・説明領域</p>
        </div>

        <div class="section">
            <h2>Abilities</h2>
            <p>スキル・設定・能力など</p>
        </div>

        <div class="section">
            <h2>History</h2>
            <p>時系列データ</p>
        </div>

    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    Nazarick Knowledge Base System v0.1
</div>

</body>
</html>
