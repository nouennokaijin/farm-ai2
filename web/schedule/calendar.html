<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
    margin:0;
    padding:0;
    background:#000;
    color:#d7a45b;
    font-family:"Yu Gothic",sans-serif;
}
.card{
    padding:20px;
    background:#1a1a1a;
    border:1px solid #d7a45b;
    min-height:200px;
}
.menu-item{
    position:relative;
    padding:12px 14px;
    margin-top:12px;
    cursor:pointer;
    user-select:none;

    color:#b89a55;
    background:linear-gradient(145deg,#1a1a1a,#0f0f0f);
    border:1px solid #6d5522;
    border-radius:8px;

    transition:.25s;
}

.menu-item:hover{
    background:linear-gradient(145deg,#222,#111);
    border-color:#a8842f;
}
body {
      font-family: sans-serif;
    }

    #form {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }

    input, select, button {
      padding: 6px;
    }
</style>
</head>
<div class="card">
 <h2>📅 Nazarick Calendar</h2>

  <!-- ==============================
    入力フォーム
  ============================== -->
  <div id="form">

    <input id="title" placeholder="予定">

    <select id="tag">
      <option value="work">仕事</option>
      <option value="part">バイト</option>
      <option value="health">ヘルス</option>
      <option value="other">その他</option>
    </select>

    <input id="time" type="time">

    <button id="addBtn">追加</button>

  </div>

  <!-- カレンダー -->
  <div id="calendar"></div>
  <script src="./app.js"></script>
</div>
    <br><br><br>
</body>
</html>
