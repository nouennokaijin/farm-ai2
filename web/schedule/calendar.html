<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
  <meta charset="UTF-8">
  <title>Nazarick Calendar v1.1</title>
  <style>



  </style>
</head>

<body>

<div class="frame">

  <div class="title">
    📅 Nazarick Calendar v1.1
    <br>
    <p>思考は結晶となり、世界は静かに動き出す</p>
    <br>
  </div>

  <div class="frame-inner">
    <div class="frame-inner" id="calendar"></div>
    <br>
  </div>

</div>

<br><br><br>

<!-- =========================
     日別一覧モーダル
========================= -->

<div id="dayModal" class="modal">

  <div class="modal-content">

    <h2 id="dayTitle"></h2>

    <div class="toolbar">

      <button id="newEventBtn">
        ＋ 新規予定
      </button>

      <button id="closeDayModal">
        閉じる
      </button>

    </div>

    <div id="eventList"></div>

    <br>

  </div>

  <br>

</div>

<!-- =========================
     新規・編集モーダル
========================= -->

<div id="eventModal" class="modal">

  <div class="modal-content">

    <h2 id="eventModalTitle">
      新規予定
    </h2>

    <input
      type="hidden"
      id="eventId">

    <!-- 日付 -->

    <label>日付</label>

    <input
      type="date"
      id="eventDate">

    <!-- 時間 -->

    <label>開始時刻</label>

    <input
      type="time"
      id="startTime">

    <label>終了時刻</label>

    <input
      type="time"
      id="endTime">

    <!-- タイトル -->

    <label>タイトル</label>

    <input
      type="text"
      id="eventTitleInput"
      placeholder="予定名">

    <!-- タグ -->

    <label>タグ</label>

    <select id="eventTag">

      <option value="work">
        仕事
      </option>

      <option value="meeting">
        会議
      </option>

      <option value="management">
        運営
      </option>

      <option value="private">
        私用
      </option>

      <option value="other">
        その他
      </option>

    </select>

    <!-- 持ち物 -->

    <label>持ち物</label>

    <textarea
      id="eventItems"
      placeholder="1行に1つ入力&#10;ノートPC&#10;充電器&#10;名刺">
    </textarea>

    <!-- メモ -->

    <label>メモ</label>

    <textarea
      id="eventMemo"
      placeholder="メモ">
    </textarea>
    <!-- ボタン -->

    <div class="toolbar">

      <button id="saveEventBtn">
        保存
      </button>

      <button id="deleteEventBtn">
        削除
      </button>

      <button id="closeEventModal">
        もどる
      </button>

    </div>

    <br>

  </div>

  <br>

</div>

<script
  type="module"
  src="app.js">
</script>

</body>
</html>
