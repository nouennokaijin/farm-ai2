<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ナザリック地下大墳墓</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d7a45b;
    font-family:"Yu Gothic",sans-serif;
    /*height:100vh; */
    overflow:hidden;
}

/* ====================
   ヘッダー
==================== */

.header{
    position:relative;
    height:220px;
    overflow:hidden;
    border-bottom:none; /* 1px solid #d7a45b; */
    transition:height .4s ease;
}

.header-image{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.65;
    transition:opacity .4s ease;
}

.header-overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:linear-gradient(rgba(0,0,0,.2), rgba(0,0,0,.7));
}

.header-overlay h1{
    color:#ffd700;
    font-size:42px;
    letter-spacing:4px;
    transition:.4s;
    text-shadow:0 0 15px rgba(255,215,0,.4);
}

.header-overlay p{
    margin-top:10px;
    transition:.4s;
}

/* 縮小 */

.header.shrink{
    height:70px;
}

.header.shrink .header-image{
    opacity:.15;
}

.header.shrink .header-overlay h1{
    font-size:24px;
}

.header.shrink .header-overlay p{
    opacity:0;
}

/* ====================
   レイアウト
==================== */

.container{
    display:flex;
    height:calc(100vh - 220px);
    transition:.4s;
}

.header.shrink + .container{
    height:calc(100vh - 70px);
}

/* ====================
   サイドバー
==================== */

.sidebar{
    width:176px;
    /*height:100vh;：*/
    height: 1200px;
    background:#111;
    border-right:none; /* 1px solid #d7a45b; */
    overflow-y:auto;
    padding:15px;
}

/* 🔥 ボタン強化版 */
.menu-item{
    position:relative;
    padding:12px 14px;
    margin-bottom:12px;
    cursor:pointer;
    user-select:none;

    color:#b89a55;
    background:linear-gradient(145deg,#1a1a1a,#0f0f0f);
    border:1px solid #6d5522;
    border-radius:8px;

    transition:.25s;
    overflow:hidden;

    box-shadow:
        inset 0 0 0 rgba(0,0,0,0),
        0 0 0 rgba(0,0,0,0);
}

/* 左の魔導ライン */
.menu-item::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:3px;
    height:100%;
    background:linear-gradient(#ffd700, transparent, #8b6a2b);
    opacity:.6;
}

/* 上下の封印ライン */
.menu-item::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(to right, transparent, rgba(255,215,0,.12), transparent);
    opacity:0;
    transition:.25s;
}

/* hover */
.menu-item:hover{
    transform:translateY(-2px);
    background:linear-gradient(145deg,#222,#111);
    border-color:#a8842f;
    box-shadow:
        0 6px 18px rgba(0,0,0,.6),
        0 0 12px rgba(255,215,0,.08);
}

.menu-item:hover::after{
    opacity:1;
}

/* active（覚醒状態） */
.menu-item.active{
    color:#ffd700;
    border-color:#ffd700;
    background:linear-gradient(145deg,#2a220f,#141000);

    box-shadow:
        0 0 14px rgba(255,215,0,.18),
        inset 0 0 10px rgba(255,215,0,.08);
}

/* 押したとき */
.menu-item:active{
    transform:translateY(1px) scale(0.98);
}

/* ====================
   メイン
==================== */

.main{
    flex:1;
    overflow-y:auto;
    padding:25px;
}

.card{
    padding:20px;
    background:#1a1a1a;
    border:1px solid #d7a45b;
    min-height:200px;
}

/* ふわ切替 */
.fade{
    animation:fade .25s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
}

/* ====================
   フッター追加
==================== */

.sidebar-footer{
    margin-top:18px;
    padding-top:10px;
    border-top:1px solid #d7a45b33;

    display:flex;
    align-items:center;
    gap:8px;

    font-size:12px;
    color:#b89a55;
}

.sidebar-footer .date{
    margin-left:auto;
    font-size:11px;
    opacity:0.7;
}

</style>
</head>

<body>

<header class="header">
    <img src="./images/header.png" class="header-image">
    <div class="header-overlay">
        <h1>ナザリック地下大墳墓</h1>
        <p>すべての記録は、ここへ還る</p>
    </div>
</header>

<div class="container">

    <div class="sidebar">
<div class="menu-item active"
onclick="changePage('./home/home.html',this)">
🏰 王座の間
</div>

<div class="menu-item"
onclick="changePage('./schedule/schedule.html',this)">
📋 執務室
</div>

<div class="menu-item"
onclick="changePage('./treasury/treasury.html',this)">
💎 宝物殿
</div>

<div class="menu-item"
onclick="changePage('./library/library.html',this)">
📚 大図書館
</div>

<div class="menu-item"
onclick="changePage('./training/training.html',this)">
⚔ 第六階層
</div>
        <div class="sidebar-footer">
            <span class="icon">🌾</span>
            <span class="text">農園の怪人</span>
            <span class="date">2026/06/06</span>
        </div>

    </div>

    <div class="main">

        <iframe
            id="contentFrame"
            src="./home/home.html"
            style="
                width:100%;
                height:100%;
                border:none;
                background:#000;
            ">
        </iframe>
    </div>
</div>
<script>
const header = document.querySelector(".header");
const items = document.querySelectorAll(".menu-item");
const frame = document.getElementById("contentFrame");

function clearActive(){
    items.forEach(item=>{
        item.classList.remove("active");
    });
}

function changePage(url,clicked){
    frame.src = url;
    clearActive();
    if(clicked){
        clicked.classList.add("active");
    }
}

main.addEventListener("scroll",()=>{

    if(main.scrollTop > 50){
        header.classList.add("shrink");
    }else{
        header.classList.remove("shrink");
    }
});
</script>

</body>
</html>
