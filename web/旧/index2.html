<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ナザリック大図書館</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000000;
    color:#d7a45b;
    font-family:"Yu Gothic",sans-serif;
    height:100vh;
    overflow:hidden;
}

/* ====================
   ヘッダー
==================== */

.header{
    position:relative;

    height:220px;

    border-bottom:1px solid #d7a45b;

    overflow:hidden;

    background:#000;
}

.header-image{
    width:100%;
    height:100%;

    object-fit:cover;

    opacity:0.65;
}

.header-overlay{

    position:absolute;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        rgba(0,0,0,.3),
        rgba(0,0,0,.7)
    );
}

.header-overlay h1{

    color:#ffd700;

    font-size:42px;

    letter-spacing:4px;

    text-shadow:
        0 0 10px rgba(255,215,0,.4),
        0 0 20px #000;
}

.header-overlay p{

    margin-top:10px;

    color:#d7a45b;

    font-size:16px;
}

/* ====================
   メイン領域
==================== */

.container{

    display:flex;

    height:calc(100vh - 220px);
}

/* ====================
   左メニュー
==================== */

.sidebar{

    width:260px;

    background:#000000;

    border-right:1px solid #d7a45b;

    padding:15px;
}

.logo{

    font-size:22px;

    font-weight:bold;

    margin-bottom:20px;

    text-align:center;

    color:#d7a45b;
}
</style>
</head>

<body>

<header class="header">

    <img src="./images/header.png" class="header-image">

    <div class="header-overlay">

        <h1>ナザリック大図書館</h1>

        <p>知識を蓄え、未来を紡ぐ魔導書庫</p>

    </div>

</header>

<style>

/* ====================
   装飾付きメニュー
==================== */

.menu-item{

    position:relative;

    padding:14px;

    margin-bottom:12px;

    background:#1f1f1f;

    color:#a38a54;

    border:1px solid #8b6a2b;

    border-radius:8px;

    cursor:pointer;

    transition:0.2s;

    overflow:hidden;
}

.menu-item::before,
.menu-item::after{

    content:"";

    position:absolute;

    left:12px;

    right:12px;

    height:1px;

    background:
    linear-gradient(
        to right,
        transparent,
        #d7a45b,
        transparent
    );
}

.menu-item::before{
    top:4px;
}

.menu-item::after{
    bottom:4px;
}

.menu-item:hover{

    background:#272727;
}

.menu-item.active{

    background:#2d2415;

    color:#ffd700;

    border-color:#d7a45b;

    box-shadow:
        inset 0 0 10px rgba(255,215,0,.12);
}

/* ====================
   メイン
==================== */

.main{

    flex:1;

    overflow:auto;

    padding:25px;

    background:#000000;
}

/* ====================
   ページ
==================== */

.page{

    display:none;

    background:#1f1f1f;

    border:1px solid #d7a45b;

    padding:25px;

    min-height:600px;
}

.page.active{
    display:block;
}

.page h1{

    margin-bottom:20px;

    color:#d7a45b;
}

.page p{

    color:#a38a54;

    line-height:1.8;
}

/* ====================
   カード
==================== */

.card{

    margin-top:15px;

    padding:15px;

    background:#111111;

    border:1px solid #d7a45b;

    color:#d7a45b;
}

</style>

<div class="container">

    <!-- 左メニュー -->

    <div class="sidebar">

        <div class="logo">
            🏛 ナザリック
        </div>

        <div class="menu-item active" data-page="home">
            🏠 ホーム
        </div>

        <div class="menu-item" data-page="library">
            📚 知識庫
        </div>

        <div class="menu-item" data-page="search">
            🔍 検索
        </div>

        <div class="menu-item" data-page="ai">
            🤖 AIツール
        </div>

        <div class="menu-item" data-page="setting">
            ⚙ 設定
        </div>

    </div>

    <!-- 右側 -->

    <div class="main">
<!-- ホーム -->

        <div class="page active" id="home">

            <h1>ホーム</h1>

            <p>
                ナザリック大図書館へようこそ。
            </p>

            <div class="card">
                最近追加された知識
            </div>

            <div class="card">
                更新履歴
            </div>

        </div>

        <!-- 知識庫 -->

        <div class="page" id="library">

            <h1>知識庫</h1>

            <p>
                登録された知識を表示します。
            </p>

            <div class="card">
                HTMLメモ
            </div>

            <div class="card">
                Discord Bot資料
            </div>

            <div class="card">
                AI活用ノート
            </div>

        </div>

        <!-- 検索 -->

        <div class="page" id="search">

            <h1>検索</h1>

            <p>
                ナザリック大図書館内を検索します。
            </p>

            <div class="card">


                <input
                    type="text"
                    placeholder="検索キーワード"
                    style="
                    width:100%;
                    padding:12px;
                    background:#111;
                    color:#d7a45b;
                    border:1px solid #d7a45b;
                    border-radius:6px;
                    ">

            </div>

        </div>
<!-- AI -->

        <div class="page" id="ai">

            <h1>AIツール</h1>

            <p>
                要約・タグ生成・分類など。
            </p>

            <div class="card">
                AI要約
            </div>

            <div class="card">
                タグ生成
            </div>

            <div class="card">
                知識分類
            </div>

        </div>

        <!-- 設定 -->

        <div class="page" id="setting">

            <h1>設定</h1>

            <p>
                テーマ変更など。
            </p>

            <div class="card">
                ダークテーマ
            </div>

            <div class="card">
                システム設定
            </div>

        </div>

    </div>

</div>

<script>

/* メニュー切替 */

const menus =
document.querySelectorAll(".menu-item");

const pages =
document.querySelectorAll(".page");

menus.forEach(menu=>{

    menu.addEventListener("click",()=>{

        menus.forEach(m=>{
            m.classList.remove("active");
        });

        pages.forEach(p=>{
            p.classList.remove("active");
        });

        menu.classList.add("active");

        const target =
        menu.dataset.page;

        document
        .getElementById(target)
        .classList.add("active");

    });

});

</script>

</body>
</html>
